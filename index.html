<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>하빈이 하언이의 영어공부</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: 'Comic Sans MS', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    background: linear-gradient(160deg, #ffe29f 0%, #ffa99f 45%, #ff719a 100%);
    display: flex; align-items: center; justify-content: center;
    min-height: 100%; overflow: hidden; user-select: none;
  }
  .screen { width: 100%; max-width: 820px; padding: 20px; text-align: center; }

  h1.title { color: #fff; font-size: clamp(26px, 7vw, 46px); text-shadow: 3px 3px 0 #ff5a8a; margin-bottom: 4px; }
  .subtitle { color: #fff; font-size: clamp(14px, 4vw, 19px); margin-bottom: 26px; text-shadow: 1px 1px 0 #ff7aa2; }

  .menu-btn {
    display: block; width: 100%; max-width: 480px; margin: 12px auto; border: none; cursor: pointer;
    font-family: inherit; background: #fff; color: #ff5a8a; font-weight: bold;
    font-size: clamp(18px, 5vw, 25px); padding: 18px 22px; border-radius: 24px;
    box-shadow: 0 7px 0 #d63a6b; transition: transform .08s, box-shadow .08s; text-align: left;
  }
  .menu-btn.math { color: #2f7bd6; box-shadow: 0 7px 0 #1c5aa6; }
  .menu-btn:active { transform: translateY(4px); box-shadow: 0 3px 0 #d63a6b; }
  .menu-btn.math:active { box-shadow: 0 3px 0 #1c5aa6; }
  .menu-btn .ic { font-size: 1.3em; margin-right: 12px; }
  .menu-btn small { display:block; color:#999; font-weight:normal; font-size:.6em; margin-top:6px; margin-left:42px; }

  .home-bigrow { display:flex; gap:18px; justify-content:center; flex-wrap:wrap; }
  .home-big {
    flex:1; min-width:230px; max-width:340px; border:none; cursor:pointer; font-family:inherit;
    background:#fff; border-radius:28px; padding:34px 20px; box-shadow:0 8px 0 rgba(0,0,0,.15);
    transition: transform .08s, box-shadow .08s;
  }
  .home-big:active { transform: translateY(5px); box-shadow:0 3px 0 rgba(0,0,0,.15); }
  .home-big .emo { font-size: clamp(54px, 14vw, 80px); display:block; }
  .home-big .lab { font-size: clamp(22px, 6vw, 32px); font-weight:bold; margin-top:10px; }
  .home-big.eng .lab { color:#ff5a8a; }
  .home-big.mat .lab { color:#2f7bd6; }

  #game { display: none; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .stars { font-size: clamp(20px, 5vw, 28px); color: #fff; text-shadow: 1px 1px 0 #ff7aa2; }
  .home-btn { background: rgba(255,255,255,.85); border: none; border-radius: 30px; padding: 8px 18px;
    font-family: inherit; font-size: 18px; color: #ff5a8a; font-weight: bold; cursor: pointer; }

  .prompt { color: #fff; font-size: clamp(17px, 4.5vw, 23px); margin: 4px 0 12px; text-shadow: 1px 1px 0 #ff7aa2; min-height: 26px; }

  /* English target */
  .target-wrap { display: flex; align-items: center; justify-content: center; gap: 14px; margin-bottom: 20px; }
  .target {
    background: #fff; min-width: clamp(96px, 26vw, 140px); height: clamp(96px, 26vw, 140px); padding: 0 16px;
    border-radius: 28px; display: flex; align-items: center; justify-content: center;
    font-size: clamp(56px, 17vw, 100px); font-weight: bold; color: #ff5a8a;
    box-shadow: 0 8px 0 rgba(0,0,0,.15);
  }
  .speak-btn { background: #fff; border: none; border-radius: 50%; width: 70px; height: 70px;
    font-size: 34px; cursor: pointer; box-shadow: 0 5px 0 rgba(0,0,0,.15); }
  .speak-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,.15); }
  .speak-btn.solo { width: 118px; height: 118px; font-size: 58px; }

  /* Math equation board */
  .eqboard {
    background: rgba(255,255,255,.92); border-radius: 26px; padding: 18px 14px; margin-bottom: 18px;
    box-shadow: 0 8px 0 rgba(0,0,0,.12); min-height: 150px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
  }
  .objrow { display: flex; align-items: center; justify-content: center; gap: 6px; flex-wrap: wrap; }
  .obj { font-size: clamp(30px, 8vw, 46px); display: inline-block; animation: popin .4s both; }
  .op { font-size: clamp(34px, 9vw, 52px); font-weight: bold; color: #2f7bd6; margin: 0 6px; }
  .leave { animation: flyaway .7s forwards; }
  .eqline { font-size: clamp(30px, 8vw, 48px); font-weight: bold; color: #1c5aa6; margin-top: 4px; }
  @keyframes popin { 0%{transform:scale(0) translateY(-20px); opacity:0} 60%{transform:scale(1.25)} 100%{transform:scale(1); opacity:1} }
  @keyframes flyaway { 0%{transform:translateY(0) scale(1); opacity:1} 100%{transform:translateY(-90px) scale(.3) rotate(40deg); opacity:0} }

  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .grid.four { grid-template-columns: repeat(4, 1fr); }
  .grid.two { grid-template-columns: repeat(2, 1fr); max-width: 520px; margin: 0 auto; }
  .card {
    background: #fff; border: none; cursor: pointer; font-family: inherit;
    aspect-ratio: 1/1; border-radius: 22px; font-size: clamp(34px, 11vw, 58px);
    font-weight: bold; color: #5a4fff;
    box-shadow: 0 6px 0 rgba(0,0,0,.15); transition: transform .08s;
    display: flex; align-items: center; justify-content: center;
  }
  .card.word { font-size: clamp(22px, 6vw, 36px); color:#ff7a18; }
  .card.num { color:#2f7bd6; }
  .card:active { transform: translateY(4px); }
  .card.correct { background: #7CFC9B; color: #fff; animation: pop .4s; }
  .card.wrong { background: #ffd1d1; animation: shake .35s; }
  @keyframes pop { 0%{transform:scale(1)} 50%{transform:scale(1.18)} 100%{transform:scale(1)} }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-8px)} 75%{transform:translateX(8px)} }

  #cheer { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    flex-direction: column; pointer-events: none; z-index: 10; }
  #cheer .emoji { font-size: clamp(90px, 30vw, 160px); animation: bounce .6s; }
  #cheer .word { color: #fff; font-size: clamp(32px, 9vw, 54px); font-weight: bold; text-shadow: 3px 3px 0 #ff5a8a; }
  @keyframes bounce { 0%{transform:scale(0)} 60%{transform:scale(1.3)} 100%{transform:scale(1)} }

  .confetti { position: fixed; width: 12px; height: 12px; top: -20px; z-index: 9; border-radius: 2px; }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); opacity: 0; } }
</style>
</head>
<body>

  <!-- HOME -->
  <div class="screen" id="home">
    <h1 class="title">🌟 하빈이 하언이의 영어공부 🌟</h1>
    <p class="subtitle">무엇을 공부할까요?</p>
    <div class="home-bigrow">
      <button class="home-big eng" onclick="showEnglish()"><span class="emo">🔤</span><span class="lab">영어</span></button>
      <button class="home-big mat" onclick="showMath()"><span class="emo">🔢</span><span class="lab">수학</span></button>
    </div>
  </div>

  <!-- ENGLISH MENU -->
  <div class="screen" id="englishMenu" style="display:none">
    <h1 class="title">🔤 영어</h1>
    <p class="subtitle">게임을 골라보세요</p>
    <button class="menu-btn" onclick="startGame('eng',1)"><span class="ic">🔠</span>대소문자 찾기<small>A 를 보고 a 를 찾아요</small></button>
    <button class="menu-btn" onclick="startGame('eng',2)"><span class="ic">🔊</span>소리 듣고 찾기<small>발음만 듣고 글자를 찾아요</small></button>
    <button class="menu-btn" onclick="startGame('eng',3)"><span class="ic">🖼️</span>그림 보고 단어 맞추기<small>그림을 보고 알맞은 단어를 찾아요</small></button>
    <button class="home-btn" style="margin-top:10px" onclick="goRoot()">🏠 처음으로</button>
  </div>

  <!-- MATH MENU -->
  <div class="screen" id="mathMenu" style="display:none">
    <h1 class="title">🔢 수학</h1>
    <p class="subtitle">무엇을 풀어볼까요?</p>
    <button class="menu-btn math" onclick="startGame('add',0)"><span class="ic">➕</span>더하기<small>그림을 세어서 답을 골라요</small></button>
    <button class="menu-btn math" onclick="startGame('sub',0)"><span class="ic">➖</span>빼기<small>없어지는 그림을 보고 답을 골라요</small></button>
    <button class="home-btn" style="margin-top:10px" onclick="goRoot()">🏠 처음으로</button>
  </div>

  <!-- GAME -->
  <div class="screen" id="game">
    <div class="topbar">
      <button class="home-btn" id="backBtn" onclick="goBack()">⬅ 뒤로</button>
      <div class="stars" id="stars">⭐ 0</div>
    </div>
    <div class="prompt" id="prompt"></div>

    <!-- english target -->
    <div class="target-wrap" id="targetWrap" style="display:none">
      <div class="target" id="target">A</div>
      <button class="speak-btn" id="speakBtn" onclick="speakCurrent()">🔊</button>
    </div>

    <!-- math board -->
    <div class="eqboard" id="eqboard" style="display:none"></div>

    <div class="grid" id="grid"></div>
  </div>

  <div id="cheer"><div class="emoji" id="cheerEmoji">🎉</div><div class="word" id="cheerWord">잘했어요!</div></div>

<script>
  const LETTERS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
  const PRAISE = ["Great!", "Awesome!", "Perfect!", "Well done!", "Super!", "Yay!"];
  const PRAISE_KR = ["잘했어요!", "최고예요!", "멋져요!", "대단해요!", "정답이에요!", "와아!"];
  const EMOJIS = ["🎉","🌟","🎈","🏆","🦄","🐶","🍭","🚀","🌈","⭐"];
  const WORDS = [
    {w:"Apple", e:"🍎"}, {w:"Banana", e:"🍌"}, {w:"Cat", e:"🐱"}, {w:"Dog", e:"🐶"},
    {w:"Egg", e:"🥚"}, {w:"Fish", e:"🐟"}, {w:"Grape", e:"🍇"}, {w:"Hat", e:"🎩"},
    {w:"Ice", e:"🧊"}, {w:"Lion", e:"🦁"}, {w:"Moon", e:"🌙"}, {w:"Star", e:"⭐"},
    {w:"Sun", e:"☀️"}, {w:"Ball", e:"⚽"}, {w:"Bear", e:"🐻"}, {w:"Duck", e:"🦆"},
    {w:"Car", e:"🚗"}, {w:"Bus", e:"🚌"}, {w:"Frog", e:"🐸"}, {w:"Bee", e:"🐝"}
  ];
  const MATH_EMOJIS = ["🍎","🍓","🐶","🐱","⭐","🎈","🍌","🐥","🚗","🍪"];
  const NUM_EN = ["zero","one","two","three","four","five","six","seven","eight","nine","ten"];

  let stars = 0, mode = "eng", level = 1, section = "english";
  let current = "A", currentWord = null, answer = 0;

  function speak(text, rate=0.85){
    try {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "en-US"; u.rate = rate; u.pitch = 1.2;
      window.speechSynthesis.speak(u);
    } catch(e){}
  }
  function speakCurrent(){
    if(mode === "eng" && level === 3 && currentWord){ speak(currentWord.w, 0.85); }
    else { speak(current, 0.7); }
  }

  function show(id){
    ["home","englishMenu","mathMenu","game"].forEach(s=>{
      document.getElementById(s).style.display = (s===id)?'block':'none';
    });
  }
  function goRoot(){ window.speechSynthesis.cancel(); show('home'); }
  function showEnglish(){ section='english'; show('englishMenu'); }
  function showMath(){ section='math'; show('mathMenu'); }
  function goBack(){
    window.speechSynthesis.cancel();
    show(section==='math' ? 'mathMenu' : 'englishMenu');
  }
  function updateStars(){ document.getElementById('stars').textContent = '⭐ ' + stars; }
  function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
  function rint(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }

  function startGame(m, lv){
    mode = m; level = lv;
    section = (m==='add'||m==='sub') ? 'math' : 'english';
    stars = 0; updateStars();
    show('game');
    nextRound();
  }

  function nextRound(){
    const targetWrap = document.getElementById('targetWrap');
    const eqboard = document.getElementById('eqboard');
    const grid = document.getElementById('grid');
    grid.innerHTML = '';

    if(mode === 'eng'){
      eqboard.style.display = 'none';
      targetWrap.style.display = 'flex';
      englishRound(grid);
    } else {
      targetWrap.style.display = 'none';
      eqboard.style.display = 'flex';
      mathRound(grid);
    }
  }

  /* ---------------- ENGLISH ---------------- */
  function englishRound(grid){
    const target = document.getElementById('target');
    const speakBtn = document.getElementById('speakBtn');
    const prompt = document.getElementById('prompt');
    speakBtn.classList.remove('solo');

    if(level === 1){
      current = LETTERS[rint(0,25)];
      prompt.textContent = '대문자를 보고 같은 소문자를 찾아요';
      target.style.display=''; target.textContent = current;
      grid.className = 'grid';
      const opts = new Set([current]);
      while(opts.size < 6) opts.add(LETTERS[rint(0,25)]);
      shuffle([...opts]).forEach(ch => addCard(grid, ch.toLowerCase(), ch===current, ch));
      setTimeout(()=>speak(current,0.7), 250);
    } else if(level === 2){
      current = LETTERS[rint(0,25)];
      prompt.textContent = '🔊 소리를 듣고 글자를 찾아요';
      target.style.display='none'; speakBtn.classList.add('solo');
      grid.className = 'grid four';
      const opts = new Set([current]);
      while(opts.size < 8) opts.add(LETTERS[rint(0,25)]);
      shuffle([...opts]).forEach(ch => addCard(grid, ch, ch===current, ch));
      setTimeout(()=>speak(current,0.7), 350);
    } else {
      currentWord = WORDS[rint(0,WORDS.length-1)];
      prompt.textContent = '그림을 보고 알맞은 단어를 찾아요';
      target.style.display=''; target.textContent = currentWord.e;
      grid.className = 'grid two';
      const opts = new Set([currentWord.w]);
      while(opts.size < 4) opts.add(WORDS[rint(0,WORDS.length-1)].w);
      shuffle([...opts]).forEach(w => addWordCard(grid, w, w===currentWord.w));
      setTimeout(()=>speak(currentWord.w, 0.85), 300);
    }
  }
  function addCard(grid, label, isCorrect, sound){
    const b = document.createElement('button');
    b.className = 'card'; b.textContent = label;
    b.onclick = () => choose(b, isCorrect, sound);
    grid.appendChild(b);
  }
  function addWordCard(grid, w, isCorrect){
    const b = document.createElement('button');
    b.className = 'card word'; b.textContent = w;
    b.onclick = () => choose(b, isCorrect, w);
    grid.appendChild(b);
  }

  /* ---------------- MATH ---------------- */
  function mathRound(grid){
    const board = document.getElementById('eqboard');
    const prompt = document.getElementById('prompt');
    const emo = MATH_EMOJIS[rint(0,MATH_EMOJIS.length-1)];
    board.innerHTML = '';
    let a, b, sentence;

    if(mode === 'add'){
      a = rint(1,5); b = rint(1,5); answer = a + b;
      prompt.textContent = '그림을 세어 보세요! 모두 몇 개일까요?';
      const rowA = document.createElement('div'); rowA.className='objrow';
      for(let i=0;i<a;i++) rowA.appendChild(makeObj(emo, i*0.12));
      const plus = document.createElement('div'); plus.className='op'; plus.textContent='+';
      const rowB = document.createElement('div'); rowB.className='objrow';
      for(let i=0;i<b;i++) rowB.appendChild(makeObj(emo, (a+i)*0.12));
      const eq = document.createElement('div'); eq.className='eqline'; eq.textContent = a+' + '+b+' = ?';
      const line = document.createElement('div'); line.className='objrow';
      line.appendChild(rowA); line.appendChild(plus); line.appendChild(rowB);
      board.appendChild(line); board.appendChild(eq);
      sentence = NUM_EN[a]+' plus '+NUM_EN[b];
      setTimeout(()=>speak(sentence,0.85), 300);
    } else {
      a = rint(2,9); b = rint(1,a-1); answer = a - b;
      prompt.textContent = '없어지고 몇 개가 남을까요?';
      const row = document.createElement('div'); row.className='objrow';
      const objs = [];
      for(let i=0;i<a;i++){ const o = makeObj(emo, i*0.1); row.appendChild(o); objs.push(o); }
      const eq = document.createElement('div'); eq.className='eqline'; eq.textContent = a+' - '+b+' = ?';
      board.appendChild(row); board.appendChild(eq);
      sentence = NUM_EN[a]+' minus '+NUM_EN[b];
      setTimeout(()=>{
        for(let i=a-b;i<a;i++){ objs[i].classList.add('leave'); }
        speak(sentence,0.85);
      }, 900);
    }

    grid.className = 'grid four';
    const opts = new Set([answer]);
    const maxN = (mode==='add')?10:9;
    while(opts.size < 4){
      let cand = answer + rint(-3,3);
      if(cand>=0 && cand<=maxN) opts.add(cand);
    }
    shuffle([...opts]).forEach(n => addNumCard(grid, n, n===answer));
  }
  function makeObj(emo, delay){
    const s = document.createElement('span'); s.className='obj'; s.textContent = emo;
    s.style.animationDelay = delay+'s';
    return s;
  }
  function addNumCard(grid, n, isCorrect){
    const b = document.createElement('button');
    b.className = 'card num'; b.textContent = n;
    b.onclick = () => choose(b, isCorrect, NUM_EN[n]);
    grid.appendChild(b);
  }

  /* ---------------- shared ---------------- */
  function choose(btn, isCorrect, sound){
    if(isCorrect){
      btn.classList.add('correct');
      speak((sound? sound+'. ':'') + PRAISE[rint(0,PRAISE.length-1)], 0.9);
      stars++; updateStars();
      celebrate();
      setTimeout(nextRound, 1500);
    } else {
      btn.classList.add('wrong');
      speak("Try again", 0.9);
      setTimeout(()=> btn.classList.remove('wrong'), 350);
    }
  }
  function celebrate(){
    const c = document.getElementById('cheer');
    document.getElementById('cheerEmoji').textContent = EMOJIS[rint(0,EMOJIS.length-1)];
    document.getElementById('cheerWord').textContent = PRAISE_KR[rint(0,PRAISE_KR.length-1)];
    c.style.display = 'flex'; dropConfetti();
    setTimeout(()=> c.style.display = 'none', 1300);
  }
  function dropConfetti(){
    const colors = ['#ff5a8a','#ffd93d','#6bcB77','#4d96ff','#c780ff','#ff9f45'];
    for(let i=0;i<40;i++){
      const d = document.createElement('div'); d.className='confetti';
      d.style.left = Math.random()*100 + 'vw';
      d.style.background = colors[rint(0,colors.length-1)];
      d.style.animation = `fall ${1+Math.random()*1.2}s linear forwards`;
      d.style.animationDelay = Math.random()*0.3 + 's';
      document.body.appendChild(d);
      setTimeout(()=> d.remove(), 2600);
    }
  }
</script>
</body>
</html>
