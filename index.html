<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>알파벳 게임</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: 'Comic Sans MS', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    background: linear-gradient(160deg, #ffe29f 0%, #ffa99f 45%, #ff719a 100%);
    display: flex; align-items: center; justify-content: center;
    min-height: 100%; overflow: hidden; user-select: none;
  }
  .screen { width: 100%; max-width: 760px; padding: 20px; text-align: center; }

  #start h1 { color: #fff; font-size: clamp(30px, 8vw, 52px); text-shadow: 3px 3px 0 #ff5a8a; margin-bottom: 6px; }
  #start p { color: #fff; font-size: clamp(15px, 4vw, 20px); margin-bottom: 24px; text-shadow: 1px 1px 0 #ff7aa2; }

  .level-btn {
    display: block; width: 100%; max-width: 480px; margin: 12px auto; border: none; cursor: pointer;
    font-family: inherit; background: #fff; color: #ff5a8a; font-weight: bold;
    font-size: clamp(18px, 5vw, 25px); padding: 18px 22px; border-radius: 24px;
    box-shadow: 0 7px 0 #d63a6b; transition: transform .08s, box-shadow .08s; text-align: left;
  }
  .level-btn:active { transform: translateY(4px); box-shadow: 0 3px 0 #d63a6b; }
  .level-btn .ic { font-size: 1.3em; margin-right: 12px; }
  .level-btn small { display:block; color:#999; font-weight:normal; font-size:.6em; margin-top:6px; margin-left:42px; }

  #game { display: none; }
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .stars { font-size: clamp(20px, 5vw, 28px); color: #fff; text-shadow: 1px 1px 0 #ff7aa2; }
  .home-btn { background: rgba(255,255,255,.85); border: none; border-radius: 30px; padding: 8px 18px;
    font-family: inherit; font-size: 18px; color: #ff5a8a; font-weight: bold; cursor: pointer; }

  .prompt { color: #fff; font-size: clamp(17px, 4.5vw, 23px); margin: 6px 0 14px; text-shadow: 1px 1px 0 #ff7aa2; min-height: 28px; }

  .target-wrap { display: flex; align-items: center; justify-content: center; gap: 14px; margin-bottom: 22px; }
  .target {
    background: #fff; min-width: clamp(100px, 28vw, 150px); height: clamp(100px, 28vw, 150px); padding: 0 16px;
    border-radius: 28px; display: flex; align-items: center; justify-content: center;
    font-size: clamp(60px, 18vw, 100px); font-weight: bold; color: #ff5a8a;
    box-shadow: 0 8px 0 rgba(0,0,0,.15);
  }
  .speak-btn {
    background: #fff; border: none; border-radius: 50%; width: 72px; height: 72px;
    font-size: 36px; cursor: pointer; box-shadow: 0 5px 0 rgba(0,0,0,.15);
  }
  .speak-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,.15); }
  .speak-btn.solo { width: 120px; height: 120px; font-size: 60px; }

  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .grid.four { grid-template-columns: repeat(4, 1fr); }
  .grid.two { grid-template-columns: repeat(2, 1fr); max-width: 520px; margin: 0 auto; }
  .card {
    background: #fff; border: none; cursor: pointer; font-family: inherit;
    aspect-ratio: 1/1; border-radius: 22px; font-size: clamp(34px, 11vw, 58px);
    font-weight: bold; color: #5a4fff;
    box-shadow: 0 6px 0 rgba(0,0,0,.15); transition: transform .08s;
    display: flex; align-items: center; justify-content: center;
  }
  .card.word { font-size: clamp(22px, 6vw, 36px); color:#ff7a18; }
  .card:active { transform: translateY(4px); }
  .card.correct { background: #7CFC9B; color: #fff; animation: pop .4s; }
  .card.wrong { background: #ffd1d1; animation: shake .35s; }
  @keyframes pop { 0%{transform:scale(1)} 50%{transform:scale(1.18)} 100%{transform:scale(1)} }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-8px)} 75%{transform:translateX(8px)} }

  #cheer {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    flex-direction: column; pointer-events: none; z-index: 10;
  }
  #cheer .emoji { font-size: clamp(90px, 30vw, 160px); animation: bounce .6s; }
  #cheer .word { color: #fff; font-size: clamp(32px, 9vw, 54px); font-weight: bold; text-shadow: 3px 3px 0 #ff5a8a; }
  @keyframes bounce { 0%{transform:scale(0)} 60%{transform:scale(1.3)} 100%{transform:scale(1)} }

  .confetti { position: fixed; width: 12px; height: 12px; top: -20px; z-index: 9; border-radius: 2px; }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); opacity: 0; } }
</style>
</head>
<body>

  <div class="screen" id="start">
    <h1>🔤 알파벳 게임 🔤</h1>
    <p>게임을 골라보세요</p>
    <button class="level-btn" onclick="startGame(1)"><span class="ic">🔠</span>대소문자 찾기
      <small>A 를 보고 a 를 찾아요</small></button>
    <button class="level-btn" onclick="startGame(2)"><span class="ic">🔊</span>소리 듣고 찾기
      <small>발음만 듣고 글자를 찾아요</small></button>
    <button class="level-btn" onclick="startGame(3)"><span class="ic">🖼️</span>그림 보고 단어 맞추기
      <small>그림을 보고 알맞은 단어를 찾아요</small></button>
  </div>

  <div class="screen" id="game">
    <div class="topbar">
      <button class="home-btn" onclick="goHome()">🏠 처음</button>
      <div class="stars" id="stars">⭐ 0</div>
    </div>
    <div class="prompt" id="prompt"></div>
    <div class="target-wrap" id="targetWrap">
      <div class="target" id="target">A</div>
      <button class="speak-btn" id="speakBtn" onclick="speakCurrent()" title="소리 듣기">🔊</button>
    </div>
    <div class="grid" id="grid"></div>
  </div>

  <div id="cheer"><div class="emoji" id="cheerEmoji">🎉</div><div class="word" id="cheerWord">잘했어요!</div></div>

<script>
  const LETTERS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
  const PRAISE = ["Great!", "Awesome!", "Perfect!", "Well done!", "Super!", "Yay!"];
  const PRAISE_KR = ["잘했어요!", "최고예요!", "멋져요!", "대단해요!", "정답이에요!", "와아!"];
  const EMOJIS = ["🎉","🌟","🎈","🏆","🦄","🐶","🍭","🚀","🌈","⭐"];
  const WORDS = [
    {w:"Apple", e:"🍎"}, {w:"Banana", e:"🍌"}, {w:"Cat", e:"🐱"}, {w:"Dog", e:"🐶"},
    {w:"Egg", e:"🥚"}, {w:"Fish", e:"🐟"}, {w:"Grape", e:"🍇"}, {w:"Hat", e:"🎩"},
    {w:"Ice", e:"🧊"}, {w:"Lion", e:"🦁"}, {w:"Moon", e:"🌙"}, {w:"Star", e:"⭐"},
    {w:"Sun", e:"☀️"}, {w:"Ball", e:"⚽"}, {w:"Bear", e:"🐻"}, {w:"Duck", e:"🦆"},
    {w:"Car", e:"🚗"}, {w:"Bus", e:"🚌"}, {w:"Frog", e:"🐸"}, {w:"Bee", e:"🐝"}
  ];

  let stars = 0, level = 1;
  let current = "A";       // for level 1 & 2 (a letter)
  let currentWord = null;  // for level 3 (an object)

  function speak(text, rate=0.8){
    try {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "en-US"; u.rate = rate; u.pitch = 1.2;
      window.speechSynthesis.speak(u);
    } catch(e){}
  }
  function speakCurrent(){
    if(level === 3 && currentWord){ speak(currentWord.w, 0.85); }
    else { speak(current, 0.7); }
  }

  function startGame(lv){
    level = lv;
    document.getElementById('start').style.display = 'none';
    document.getElementById('game').style.display = 'block';
    stars = 0; updateStars();
    nextRound();
  }
  function goHome(){
    window.speechSynthesis.cancel();
    document.getElementById('game').style.display = 'none';
    document.getElementById('start').style.display = 'block';
  }
  function updateStars(){ document.getElementById('stars').textContent = '⭐ ' + stars; }
  function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

  function nextRound(){
    const target = document.getElementById('target');
    const speakBtn = document.getElementById('speakBtn');
    const prompt = document.getElementById('prompt');
    const grid = document.getElementById('grid');
    speakBtn.classList.remove('solo');
    grid.innerHTML = '';

    if(level === 1){
      // uppercase shown -> find lowercase
      current = LETTERS[Math.floor(Math.random()*LETTERS.length)];
      prompt.textContent = '대문자를 보고 같은 소문자를 찾아요';
      target.style.display = ''; target.textContent = current;
      grid.className = 'grid';
      const opts = new Set([current]);
      while(opts.size < 6){ opts.add(LETTERS[Math.floor(Math.random()*LETTERS.length)]); }
      shuffle([...opts]).forEach(ch => addCard(grid, ch.toLowerCase(), ch === current));
      setTimeout(()=>speak(current,0.7), 250);

    } else if(level === 2){
      // sound only -> find the letter
      current = LETTERS[Math.floor(Math.random()*LETTERS.length)];
      prompt.textContent = '🔊 소리를 듣고 글자를 찾아요';
      target.style.display = 'none';
      speakBtn.classList.add('solo');
      grid.className = 'grid four';
      const opts = new Set([current]);
      while(opts.size < 8){ opts.add(LETTERS[Math.floor(Math.random()*LETTERS.length)]); }
      shuffle([...opts]).forEach(ch => addCard(grid, ch, ch === current));
      setTimeout(()=>speak(current,0.7), 350);

    } else {
      // picture shown -> pick the word
      currentWord = WORDS[Math.floor(Math.random()*WORDS.length)];
      prompt.textContent = '그림을 보고 알맞은 단어를 찾아요';
      target.style.display = ''; target.textContent = currentWord.e;
      grid.className = 'grid two';
      const opts = new Set([currentWord.w]);
      while(opts.size < 4){ opts.add(WORDS[Math.floor(Math.random()*WORDS.length)].w); }
      shuffle([...opts]).forEach(w => addWordCard(grid, w, w === currentWord.w));
      setTimeout(()=>speak(currentWord.w, 0.85), 300);
    }
  }

  function addCard(grid, label, isCorrect){
    const b = document.createElement('button');
    b.className = 'card'; b.textContent = label;
    b.onclick = () => choose(b, isCorrect, label);
    grid.appendChild(b);
  }
  function addWordCard(grid, w, isCorrect){
    const b = document.createElement('button');
    b.className = 'card word'; b.textContent = w;
    b.onclick = () => choose(b, isCorrect, w);
    grid.appendChild(b);
  }

  function choose(btn, isCorrect, label){
    if(isCorrect){
      btn.classList.add('correct');
      speak(label + ". " + PRAISE[Math.floor(Math.random()*PRAISE.length)], 0.9);
      stars++; updateStars();
      celebrate();
      setTimeout(nextRound, 1500);
    } else {
      btn.classList.add('wrong');
      speak("Try again", 0.9);
      setTimeout(()=> btn.classList.remove('wrong'), 350);
    }
  }

  function celebrate(){
    const c = document.getElementById('cheer');
    document.getElementById('cheerEmoji').textContent = EMOJIS[Math.floor(Math.random()*EMOJIS.length)];
    document.getElementById('cheerWord').textContent = PRAISE_KR[Math.floor(Math.random()*PRAISE_KR.length)];
    c.style.display = 'flex';
    dropConfetti();
    setTimeout(()=> c.style.display = 'none', 1300);
  }

  function dropConfetti(){
    const colors = ['#ff5a8a','#ffd93d','#6bcB77','#4d96ff','#c780ff','#ff9f45'];
    for(let i=0;i<40;i++){
      const d = document.createElement('div');
      d.className = 'confetti';
      d.style.left = Math.random()*100 + 'vw';
      d.style.background = colors[Math.floor(Math.random()*colors.length)];
      d.style.animation = `fall ${1+Math.random()*1.2}s linear forwards`;
      d.style.animationDelay = Math.random()*0.3 + 's';
      document.body.appendChild(d);
      setTimeout(()=> d.remove(), 2600);
    }
  }
</script>
</body>
</html>
